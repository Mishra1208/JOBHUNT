name: JobHunt 3-Hour Automatic Cloud Job Scanner

on:
  schedule:
    # Runs every 3 hours automatically 24/7
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  job_scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Live Multi-User Job Scanner & Notifier
        run: |
          python -c "
          import sys; sys.path.append('backend')
          import database as db, main
          db.init_db()
          users = db.get_db_connection().execute('SELECT id, email FROM users').fetchall()
          for u in users:
              print(f'Running 3-hour automated cloud scan for user {u[\"id\"]} ({u[\"email\"]})...')
              main.run_job_scan_task_for_user(u['id'])
          "
